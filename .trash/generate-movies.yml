name: Generate Final Movie (.mp4)

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/images/**'
      - 'assets/audios/**'

jobs:
  generate-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Movie Generation Script
        run: |
          python generate_movies.py

      - name: Commit generated movies
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/videos/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate 16:9 cinematic movies"
          git push
