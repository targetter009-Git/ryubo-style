<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>targetter009 | 指向哲学 (Oriented-Philosophia)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #e2e8f0;
            --accent-gold: #d97706;
            --card-bg: #1e293b;
            --border-color: #334155;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 3rem auto;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 0.05em;
            color: #f8fafc;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #94a3b8;
            font-style: italic;
            font-size: 1rem;
        }

        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .film-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .film-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
        }

        .film-card.pattern-a {
            border-left: 4px solid #3b82f6; /* 青のアクセント */
        }

        .film-card.pattern-b {
            border-left: 4px solid #ef4444; /* 赤のアクセント */
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .badge {
            background-color: #0f172a;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .date {
            color: #64748b;
        }

        .film-title {
            font-size: 1.25rem;
            margin: 0 0 0.8rem 0;
            color: #f1f5f9;
        }

        .film-preview {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }

        .card-footer {
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px dashed var(--border-color);
            padding-top: 0.8rem;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: #475569;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>targetter009</h1>
        <p class="subtitle">指向哲学（Oriented-Philosophia）/ RyuboStyle 映写ポータル</p>
    </header>

    <main class="film-grid">
        
        <article class="film-card pattern-a">
            <div class="card-header">
                <span class="badge">Pattern A / Dialogue</span>
                <time class="date">2026-10-08</time>
            </div>
            <h2 class="film-title">飲茶坊さとしの指向哲学（Oriented-Philosophia）対話録</h2>
            <p class="film-preview">**日付:** 2026年10月08日 午前...</p>
            <div class="card-footer">
                <span class="file-tag">🎞️ Film.2026.10.08.AM.md</span>
            </div>
        </article>
        
    </main>

    <footer>
        <p>&copy; 2026 RyuboStyle — Projected by built.py</p>
    </footer>
</body>
</html>
