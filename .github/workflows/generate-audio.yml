name: Auto Generate Audio from Scripts

on:
  push:
    paths:
      - 'documents/*.md'
      - 'scripts/generate_speech.py'
  workflow_dispatch: # 手動実行ボタンも用意

jobs:
  build-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gTTS

      - name: Run Speech Generation Script
        run: |
          python scripts/generate_speech.py

      - name: Commit and Push Generated Audio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Generate speech audio from scripts (.mp3)"
          file_pattern: 'assets/audio/*.mp3'
