name: Generate Audio Track

on:
  workflow_dispatch:
  push:
    paths:
      - 'documents/Film.*.md'

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Speech Generation Script
        run: |
          python generate_speech.py

      - name: Commit generated audio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/audios/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate audio tracks"
          git push
