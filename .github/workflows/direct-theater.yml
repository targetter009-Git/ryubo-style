name: Ryubo Style Theater Director

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  direct:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # ※ requirements.txt を探させないようキャッシュ設定を削除またはシンプルに

      - name: Install dependencies (PyYAML only)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Direct with Manager
        run: |
          python manager.py
