name: Ryubo Style Theater Director

# 🎬 どのようなトリガーで監督を起動するか
on:
  # 1. リポジトリの main ブランチにファイルがプッシュ（更新）されたとき自動起動
  push:
    branches:
      - main
  
  # 2. GitHubの Actions タブから手動でも「上映（起動）」できるようにする設定
  workflow_dispatch:

# 実行するジョブの定義
jobs:
  direct:
    runs-on: ubuntu-latest
    
    steps:
      # ステップ1: リポジトリのコードをクラウド上のランナーにチェックアウト（取得）する
      - name: Checkout repository
        uses: actions/checkout@v4

      # ステップ2: Python環境をセットアップする
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 依存関係のキャッシュ（必要に応じて）

      # ステップ3: 必要なライブラリ（yamlなど）をインストールする
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # ステップ4: 総監督（manager.py）をキックして撮影・ビルドを開始する
      - name: Direct with Manager
        run: |
          python manager.py

      # （オプション）ステップ5: 生成された成果物（index.htmlやassets）をそのまま自動コミットして公開する場合
      # - name: Commit and push changes if any
      #   uses: stefanzweifel/git-auto-commit-action@v5
