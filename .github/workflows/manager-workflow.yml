name: Generate All Multimedia via Manager

on:
  workflow_dispatch:
  push:
    paths:
      - 'documents/Film.*.md'

jobs:
  run-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install moviepy gTTS requests

      - name: Run Master Manager Script
        run: |
          python manager.py

      - name: Commit all generated assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate all multimedia assets via manager.py"
          git push
